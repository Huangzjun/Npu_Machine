<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>NPU 资源看板</title>
  <meta name="board-api-origin" content="https://shared-npu-board-4.aptraisin1.chatgpt.site">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'sha256-qfConQEsf2kazJP+FcWurMto2CeTq5ta+6X+BxOVoUw='; script-src 'sha256-+MCfZN3kcghZoS1SRfivPcOyFxN/8Jt40KiSwosROZI='; connect-src https://shared-npu-board-4.aptraisin1.chatgpt.site; base-uri 'none'; form-action 'none'">
  <style>:root{color-scheme:light;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.5;color:#13213a;background:#f4f6fa;--surface:#fff;--ink:#13213a;--muted:#53637c;--soft:#edf1f7;--rule:#dae3f0;--blue:#294ac8;--purple:#6847b8;--green:#087653;--orange:#ab5220;--mono:ui-monospace,"SFMono-Regular",Menlo,monospace;--shadow:0 4px 14px #21355708}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-width:320px}
h1,h2,h3,p{margin:0}
a{color:inherit}
.topbar{background:#101c35;color:#edf2ff}
.top-inner{min-height:62px;max-width:1560px;margin:auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand,.top-actions{display:flex;align-items:center;gap:11px}
.brand{text-decoration:none;font-weight:720;font-size:.94rem;white-space:nowrap}
.brand-icon{width:31px;height:31px;padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:8px;background:#6481f2}
.brand-icon i{background:#fff;border-radius:1.5px}
.brand-icon i:nth-child(2),.brand-icon i:nth-child(3){opacity:.55}
.refresh-state{color:#c6d2ee;font-size:.81rem;text-align:right}
main{max-width:1560px;margin:auto;padding:37px 32px 66px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
h1{font-size:clamp(1.94rem,4vw,3rem);font-weight:780;letter-spacing:-.055em;line-height:1.15}
.hero p{color:var(--muted);margin-top:7px;font-size:.95rem}
button{cursor:pointer;border:1px solid transparent;border-radius:9px;background:var(--blue);color:#fff;padding:9px 15px;font:inherit;font-size:.9rem;font-weight:700;white-space:nowrap;transition:background .15s,border-color .15s}
button:hover{background:#1f3ba9}
button:disabled{opacity:.5;cursor:default}
.secondary{color:#263e88;background:#f1f4fe;border-color:#dce5fd;padding:6px 10px;font-size:.83rem}
.secondary:hover{background:#e5ebfe}
.refresh-button{color:#e1e8fc;background:#253451;border-color:#455472}
.refresh-button:hover{background:#354764}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.topbar :focus-visible{outline-color:#b2c2ff}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:29px}
.kpi{box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:15px 16px}
.kpi-label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.86rem;font-weight:650}
.kpi strong{display:block;margin:9px 0 10px;font:700 clamp(1.46rem,3vw,2.15rem)/1.12 var(--mono);letter-spacing:-.06em}
.indicator{width:8px;height:8px;flex:0 0 auto;border-radius:50%;display:inline-block;background:#a0adc1}
.indicator.online,.indicator.free{background:#2da777}
.indicator.reserved{background:#8266cc}
.indicator.running{background:#db873d}
progress{display:block;appearance:none;width:100%;height:5px;border:none;border-radius:10px;overflow:hidden;background:#edf1f8;--meter:#5779e7}
progress::-webkit-progress-bar{background:#edf1f8}
progress::-webkit-progress-value{background:var(--meter);border-radius:10px}
progress::-moz-progress-bar{background:var(--meter)}
#online-bar,#free-bar{--meter:#29976f}
#reserved-bar{--meter:#8064c8}
#running-bar{--meter:#d17d38}
.section-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:11px}
h2{font-size:1.22rem;line-height:1.3}
#filter-count{min-height:1em;color:var(--muted);font-size:.84rem;margin-top:4px}
.filters{display:flex;align-items:center;gap:8px}
.filter-label{margin:0;display:flex;align-items:center;gap:7px;color:var(--muted);white-space:nowrap;font-size:.82rem}
.filter-label select{width:auto;margin:0;padding:6px 25px 6px 9px;font-size:.86rem;font-weight:600}
.machines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.machine{min-width:0;box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:15px}
.machine-head,.card-title,.card-data,.group-row{display:flex;justify-content:space-between;align-items:center;gap:7px}
.machine-head h3{font-size:1.16rem;font-weight:760;white-space:nowrap}
.machine-head .state{margin-right:auto}
.state,.chip-state{font-weight:650;font-size:.76rem;border-radius:999px;white-space:nowrap}
.state{padding:3px 8px;background:#edf1f8;color:var(--muted)}
.state.online{background:#e9f7f1;color:var(--green)}
.state.stale,.attention{color:var(--orange)}
.state.stale{background:#fff0df}
.model{font-size:.81rem;color:var(--muted);margin:4px 0 9px}
.host-metrics{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.host-metrics span{background:#f0f3f8;border-radius:5px;padding:3px 7px;color:#435575;font-size:.78rem;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.card{min-width:0;background:#f8faff;border:1px solid #e3ebf8;border-radius:9px;padding:8px}
.card.busy{background:#f7f2ff;border-color:#e6d9fb}
.card-title strong{font:750 .83rem var(--mono);white-space:nowrap}
.chip-state{display:block;padding:2px 6px;margin:4px 0;max-width:100%;width:max-content;overflow:hidden;text-overflow:ellipsis;background:#edf1f8;color:var(--muted)}
.chip-state.free{background:#e7f6ee;color:var(--green)}
.chip-state.reserved{background:#ebdfff;color:var(--purple)}
.chip-state.running{background:#fdf0e0;color:#8c451b}
.card-data{color:#435575;font-size:.76rem;font-variant-numeric:tabular-nums}
.card-data span{white-space:nowrap}
.card .meter{margin:4px 0 5px;--meter:#5676e2;height:4px}
.card .memory-meter{--meter:#2c9984}
.card-foot{margin-top:5px;padding-top:4px;border-top:1px solid #e7edf7}
.group-row{margin-top:8px;padding-top:6px;border-top:1px solid var(--rule);font-size:.83rem;overflow-wrap:anywhere}
.group-actions{display:flex;gap:5px}
.empty{text-align:center;color:var(--muted);border:1px dashed var(--rule);border-radius:12px;padding:28px}
dialog{width:min(480px,calc(100% - 24px));padding:20px;border:1px solid var(--rule);border-radius:15px;color:var(--ink);background:var(--surface);box-shadow:0 20px 80px #18234940}
dialog::backdrop{background:#17253475}
.dialog-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.close{font-size:1.15rem;padding:0 7px}
label{display:block;margin:10px 0;font-weight:650;font-size:.92rem}
input:not([type=checkbox]),select{display:block;width:100%;margin:4px 0 0;padding:7px 9px;border:1px solid #ccd8eb;border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
fieldset{margin:9px 0;padding:7px 9px;border:1px solid var(--rule);border-radius:8px}
legend{font-weight:680}
.form-columns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.choices label{margin:0;font-size:.8rem;white-space:nowrap}
.choices input{accent-color:var(--blue)}
#employee-note{font-size:.81rem;color:var(--muted);margin:-5px 0 10px}
#form-error{color:#ad243d;font-size:.86rem;margin:8px 0}
#form-error:empty{display:none}
#notice{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 14px;border-radius:9px;background:#142953;color:#fff;max-width:90vw}
@media(max-width:1120px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){.machines{grid-template-columns:1fr}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:560px){main{padding:23px 12px 48px}.top-inner{padding:0 12px;min-height:55px}.top-actions{gap:7px}.refresh-state{font-size:.7rem}.hero{gap:8px;margin-bottom:16px}.hero p{font-size:.81rem}.hero button{padding:7px 8px}.summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:20px}.kpi{padding:9px 11px}.kpi-label{font-size:.78rem}.section-heading{display:block}.filters{margin-top:6px;justify-content:space-between}.filter-label{gap:4px}.filter-label select{padding-right:10px;max-width:145px}.machine{padding:11px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="top-inner">
      <a class="brand" href="./" aria-label="返回 NPU 资源看板"><span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>NPU 资源看板</span></a>
      <div class="top-actions"><span id="refresh" class="refresh-state" role="status">正在加载</span><button id="reload" class="secondary refresh-button" type="button">刷新</button></div>
    </div>
  </header>
  <main>
    <section class="hero" aria-labelledby="heading">
      <div>
        <h1 id="heading">集群总览</h1>
        <p id="cluster-note">昇腾 950DT · 团队用卡与机器负载</p>
      </div>
      <button id="reserve" type="button">＋ 登记占用</button>
    </section>
    <section class="summary" aria-label="资源概览">
      <div class="kpi"><span class="kpi-label"><i class="indicator online"></i>在线机器</span><strong id="online">—</strong><progress id="online-bar" aria-label="在线机器占比" max="1" value="0"></progress></div>
      <div class="kpi"><span class="kpi-label"><i class="indicator reserved"></i>已登记 NPU</span><strong id="registered">—</strong><progress id="reserved-bar" aria-label="已登记卡占比" max="1" value="0"></progress></div>
      <div class="kpi"><span class="kpi-label"><i class="indicator running"></i>有进程的 NPU</span><strong id="running">—</strong><progress id="running-bar" aria-label="有进程卡占比" max="1" value="0"></progress></div>
      <div class="kpi"><span class="kpi-label"><i class="indicator free"></i>无进程且未登记</span><strong id="free">—</strong><progress id="free-bar" aria-label="无进程且未登记卡占比" max="1" value="0"></progress></div>
    </section>
    <section class="fleet" aria-labelledby="fleet-title">
      <div class="section-heading">
        <div><h2 id="fleet-title">机器与 NPU</h2><p id="filter-count" role="status"></p></div>
        <div class="filters">
          <label class="filter-label">机器<select id="machine-filter"><option value="">全部机器</option></select></label>
          <label class="filter-label">卡状态<select id="card-filter"><option value="">全部状态</option><option value="free">无进程且未登记</option><option value="reserved">已登记</option><option value="running">有进程</option><option value="unknown">数据缺失</option></select></label>
        </div>
      </div>
      <div id="machines" class="machines"></div>
      <p id="empty" class="empty" hidden>当前筛选条件下没有 NPU。</p>
    </section>
  </main>
  <dialog id="dialog" aria-labelledby="form-title">
    <form id="form">
      <div class="dialog-heading"><h2 id="form-title">登记占用</h2><button id="close" class="secondary close" aria-label="关闭" type="button">×</button></div>
      <div id="fields">
        <label>机器<select id="machine"></select></label>
        <fieldset><legend>选择 NPU</legend><div id="choices" class="choices"></div></fieldset>
        <div class="form-columns">
          <label>团队名称<input id="team" required maxlength="64" placeholder="输入团队名称" autocomplete="organization"></label>
          <label>工号<input id="employee" required maxlength="32" placeholder="输入工号" autocomplete="off" aria-describedby="employee-note"></label>
        </div>
        <p id="employee-note">公开看板最多显示工号末四位。</p>
      </div>
      <label>预计结束时间<input id="ends" type="datetime-local" required></label>
      <p id="form-error" role="alert"></p>
      <button id="submit" type="submit">确认登记</button>
    </form>
  </dialog>
  <div id="notice" role="status" hidden></div>
  <script>const apiOrigin = document.querySelector('meta[name=board-api-origin]')?.content || location.origin;
const apiUrl = path => new URL(path, apiOrigin);
const el = id => document.getElementById(id);
const dialog = el('dialog');
const dateFormat = new Intl.DateTimeFormat('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const time = value => dateFormat.format(new Date(value));
const percent = value => value == null ? '—' : value + '%';
let board;
let editing;
let noticeTimer;
let refreshing = false;
const managementKey = 'npu-board-owner-v1';
const reservationsKey = 'npu-board-reservations-v1';
const storage = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* Browser can still manage this visit. */ } },
};
let key = storage.get(managementKey);
let owned;
try { owned = JSON.parse(storage.get(reservationsKey) || '{}') || {}; } catch { owned = {}; }

function node(tag, content, className) {
  const item = document.createElement(tag);
  if (content != null) item.textContent = content;
  if (className) item.className = className;
  return item;
}

function button(text, action) {
  const item = node('button', text, 'subtle');
  item.type = 'button';
  item.addEventListener('click', action);
  return item;
}

function notify(message) {
  el('notice').textContent = message;
  el('notice').hidden = false;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { el('notice').hidden = true; }, 5000);
}

function browserKey() {
  if (!key) {
    const existing = storage.get(managementKey);
    key = existing || Array.from(crypto.getRandomValues(new Uint8Array(32)), byte => byte.toString(16).padStart(2, '0')).join('');
    storage.set(managementKey, key);
  }
  return key;
}

function remember(id, expires) {
  const current = Object.fromEntries(Object.entries(owned).filter(([, end]) => end > Date.now()));
  if (expires) current[id] = expires;
  else delete current[id];
  owned = current;
  storage.set(reservationsKey, JSON.stringify(owned));
}

async function api(path, method, body) {
  const response = await fetch(apiUrl(path), {
    method,
    headers: { 'x-board-key': browserKey(), ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (response.status === 204) return null;
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || '操作失败，请重试');
  return data;
}

function observe(machine, id) {
  const reading = machine.metrics?.cards.find(card => card.id === id);
  const reservation = machine.reservations.find(item => item.cards.includes(id));
  const current = machine.status === 'online' && reading;
  return {
    id, reading, reservation,
    hasProcess: Boolean(current && reading.processes > 0),
    available: Boolean(current && !reservation && reading.processes === 0 && reading.utilization === 0),
    unknown: !current || reading.processes == null,
  };
}

function meter(label, value, extraClass = '') {
  const element = node('progress', null, 'meter ' + extraClass);
  element.max = 100;
  element.value = value ?? 0;
  element.setAttribute('aria-label', label + ' ' + percent(value));
  return element;
}

function cardView({ id, reading, reservation, hasProcess, available, unknown }) {
  const card = node('article', null, 'card' + (reservation ? ' busy' : ''));
  const heading = node('div', null, 'card-title');
  heading.append(node('strong', 'NPU ' + id));
  const condition = reservation ? 'reserved' : hasProcess ? 'running' : available ? 'free' : '';
  const statusLabel = reservation?.team || (hasProcess ? '有进程' : available ? '未登记 · 无进程' :
    unknown ? '数据缺失' : '计算活跃');
  const badge = node('span', statusLabel, 'chip-state ' + condition);
  badge.title = reservation ? reservation.team + ' · 至 ' + time(reservation.endsAt) : statusLabel;

  const hbm = reading?.hbmUsed != null && reading?.hbmTotal
    ? (reading.hbmUsed / 1024).toFixed(1) + '/' + (reading.hbmTotal / 1024).toFixed(0)
    : '—';
  const hbmPercent = hbm === '—' ? null : Math.round(100 * reading.hbmUsed / reading.hbmTotal);
  const compute = node('div', null, 'card-data');
  compute.append(node('span', '计算'), node('strong', percent(reading?.utilization)));
  const memory = node('div', null, 'card-data');
  memory.append(node('span', 'HBM'), node('strong', hbm === '—' ? hbm : hbm + ' GiB'));
  const detail = node('div', null, 'card-data card-foot');
  detail.append(node('span', '进程 ' + (reading?.processes ?? '—')), node('span',
    reading?.health === 'warning' ? '异常' : reading?.temperature != null ? reading.temperature + ' °C' : '—',
    reading?.health === 'warning' ? 'attention' : ''));
  card.append(heading, badge, compute, meter('计算使用率', reading?.utilization),
    memory, meter('HBM 使用率', hbmPercent, 'memory-meter'), detail);
  return card;
}

function machineView(machine, observations) {
  const section = node('section', null, 'machine');
  const heading = node('div', null, 'machine-head');
  const name = node('h3', machine.name);
  name.id = 'machine-' + machine.id;
  section.setAttribute('aria-labelledby', name.id);
  const status = { online: '在线', stale: '数据中断', pending: '等待接入' }[machine.status];
  heading.append(name, node('span', status, 'state ' + machine.status));
  heading.append(button('登记', () => showForm(machine.id)));
  const model = machine.model + ' · ' + machine.cards.length + ' 张卡';
  const last = machine.receivedAt ? ' · 采样 ' + time(machine.receivedAt) : '';
  const host = machine.metrics;
  const cards = node('div', null, 'cards');
  cards.append(...observations.map(cardView));
  const groups = node('div', null, 'groups');
  for (const reservation of machine.reservations) {
    const row = node('div', null, 'group-row');
    const selected = reservation.cards.length === machine.cards.length ? '整机' : 'NPU ' + reservation.cards.join(', ');
    const identity = reservation.team + (reservation.employeeSuffix ? ' · 工号 ••••' + reservation.employeeSuffix : '');
    row.append(node('span', identity + ' · ' + selected + ' · 至 ' + time(reservation.endsAt)));
    if (owned[reservation.id]) {
      const actions = node('span', null, 'group-actions');
      actions.append(button('续期', () => showForm(machine.id, reservation)), button('释放', async () => {
        if (!window.confirm('释放 ' + reservation.team + ' 的这次登记？')) return;
        try {
          await api('/api/reservations/' + reservation.id, 'DELETE');
          remember(reservation.id, 0);
          await refresh();
          notify('已释放占用');
        } catch (error) {
          notify(error.message);
        }
      }));
      row.append(actions);
    }
    groups.append(row);
  }
  const hostMetrics = node('div', null, 'host-metrics');
  hostMetrics.append(node('span', 'CPU ' + percent(host?.cpu)), node('span', '内存 ' + percent(host?.memory)),
    node('span', '根磁盘 ' + percent(host?.disk)));
  section.append(heading, node('p', model + last, 'model'), hostMetrics, cards, groups);
  return section;
}

function setKpi(label, bar, value, total) {
  el(label).textContent = value == null ? '—' : value + ' / ' + total;
  el(bar).max = Math.max(1, total);
  el(bar).value = value ?? 0;
}

function render() {
  const { machines } = board;
  const entries = machines.map(machine => ({
    machine,
    cards: machine.cards.map(id => observe(machine, id)),
  }));
  const allCards = entries.flatMap(entry => entry.cards);
  const observed = allCards.some(card => !card.unknown);
  setKpi('online', 'online-bar', machines.filter(machine => machine.status === 'online').length, machines.length);
  setKpi('registered', 'reserved-bar', allCards.filter(card => card.reservation).length, allCards.length);
  setKpi('running', 'running-bar', observed ? allCards.filter(card => card.hasProcess).length : null, allCards.length);
  setKpi('free', 'free-bar', observed ? allCards.filter(card => card.available).length : null, allCards.length);

  const machineFilter = el('machine-filter');
  if (machineFilter.options.length === 1) {
    machineFilter.append(...machines.map(machine => new Option(machine.name, machine.id)));
  }
  const cardFilter = el('card-filter').value;
  const fits = card => ({
    free: card.available, reserved: Boolean(card.reservation), running: card.hasProcess, unknown: card.unknown,
  })[cardFilter] ?? true;
  const selection = entries
    .filter(entry => !machineFilter.value || entry.machine.id === Number(machineFilter.value))
    .map(entry => ({ machine: entry.machine, cards: entry.cards.filter(fits) }))
    .filter(entry => entry.cards.length > 0);
  const shown = selection.reduce((total, entry) => total + entry.cards.length, 0);
  el('filter-count').textContent = selection.length + ' 台机器 · ' + shown + ' 张 NPU';
  el('machines').replaceChildren(...selection.map(entry => machineView(entry.machine, entry.cards)));
  el('empty').hidden = Boolean(selection.length);
  el('reserve').disabled = false;
}

async function refresh() {
  if (refreshing) return;
  refreshing = true;
  try {
    const response = await fetch(apiUrl('/api/board'), { cache: 'no-store' });
    if (!response.ok) throw new Error();
    board = await response.json();
    render();
    el('refresh').textContent = '同步 ' + time(board.now);
  } catch {
    el('refresh').textContent = '更新失败，稍后自动重试';
  } finally {
    refreshing = false;
  }
}

function localDate(value) {
  const date = new Date(value);
  return new Date(date.getTime() - date.getTimezoneOffset() * 60_000).toISOString().slice(0, 16);
}

function choice(id, label, disabled) {
  const box = document.createElement('input');
  box.type = 'checkbox';
  box.value = id;
  box.disabled = disabled;
  const wrapper = node('label');
  wrapper.append(box, document.createTextNode(' ' + label));
  return wrapper;
}

function renderChoices() {
  const machine = board.machines.find(item => item.id === Number(el('machine').value));
  const reserved = new Set(machine.reservations.flatMap(item => item.cards));
  const all = choice('all', '整机', reserved.size > 0);
  const options = machine.cards.map(id => choice(id, 'NPU ' + id + (reserved.has(id) ? ' 已登记' : ''), reserved.has(id)));
  const allBox = all.firstChild;
  allBox.addEventListener('change', () => {
    for (const option of options) {
      const box = option.firstChild;
      box.disabled = allBox.checked || reserved.has(Number(box.value));
      if (allBox.checked) box.checked = false;
    }
  });
  el('choices').replaceChildren(all, ...options);
}

function showForm(id, reservation) {
  if (!board) return;
  editing = reservation;
  el('form-error').textContent = '';
  el('form').reset();
  el('fields').hidden = !!reservation;
  el('team').required = !reservation;
  el('employee').required = !reservation;
  el('team').value = storage.get('npu-board-team') || '';
  el('form-title').textContent = reservation ? '续期 · ' + reservation.team : '登记占用';
  el('submit').textContent = reservation ? '确认续期' : '确认登记';
  el('machine').replaceChildren(...board.machines.map(machine => new Option(machine.name, machine.id)));
  el('machine').value = id || board.machines.find(machine => machine.reservations.flatMap(item => item.cards).length < machine.cards.length)?.id || 1;
  renderChoices();
  const now = Date.now();
  const minimum = Math.max(now + 120_000, (reservation?.endsAt || 0) + 60_000);
  el('ends').min = localDate(minimum);
  el('ends').max = localDate(now + 86_400_000);
  el('ends').value = localDate(Math.min(now + 86_400_000, Math.max(now + 7_200_000, minimum)));
  dialog.showModal();
}

el('reload').addEventListener('click', refresh);
for (const id of ['machine-filter', 'card-filter']) {
  el(id).addEventListener('change', () => { if (board) render(); });
}
el('reserve').disabled = true;
el('reserve').addEventListener('click', () => showForm());
el('close').addEventListener('click', () => dialog.close());
el('machine').addEventListener('change', renderChoices);
el('form').addEventListener('submit', async event => {
  event.preventDefault();
  el('form-error').textContent = '';
  el('submit').disabled = true;
  const endsAt = new Date(el('ends').value).getTime();
  try {
    if (editing) {
      await api('/api/reservations/' + editing.id, 'PATCH', { endsAt });
      remember(editing.id, endsAt);
    } else {
      const team = el('team').value;
      const checked = [...el('choices').querySelectorAll('input:checked')].map(box => box.value);
      if (!checked.length) throw new Error('请选择一张或多张 NPU 卡');
      const result = await api('/api/reservations', 'POST', {
        machineId: Number(el('machine').value), team, endsAt, employee: el('employee').value,
        cards: checked.includes('all') ? 'all' : checked.map(Number),
      });
      remember(result.id, result.endsAt);
      storage.set('npu-board-team', team);
    }
    dialog.close();
    await refresh();
    notify(editing ? '已续期' : '已登记占用');
  } catch (error) {
    el('form-error').textContent = error.message;
    if (!editing) {
      const previous = el('form-error').textContent;
      if (previous.includes('已被登记')) {
        await refresh();
        renderChoices();
      }
    }
  } finally {
    el('submit').disabled = false;
  }
});
window.addEventListener('storage', event => {
  if (event.key === reservationsKey) {
    try { owned = JSON.parse(event.newValue || '{}'); } catch { owned = {}; }
    if (board) render();
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
refresh();
setInterval(refresh, 15_000);
</script>
</body>
</html>
